[package]
name = "bubble-cli"
description = "Bubble's command-line agent in Rust: one-shot (-p) and interactive."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bubble"
path = "src/main.rs"

[dependencies]
bubble-core = { path = "../crates/bubble-core" }
bubble-store = { path = "../crates/bubble-store" }
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "io-std"] }
log.workspace = true
reqwest.workspace = true
bubble-term = { path = "../crates/bubble-term" }
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-engine = "0.4.0"
ignore = "0.4"
base64 = "0.22"
regex = "1"

[dev-dependencies]
serde_json.workspace = true
