[package]
name = "bubble-app"
description = "Bubble Native: the NSH app."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bubble-core = { path = "../crates/bubble-core" }
bubble-store = { path = "../crates/bubble-store" }
bubble-github = { path = "../crates/bubble-github" }
nsh-core = { version = "0.4.0", features = ["svg"] }
nsh-base = "0.4.0"
env_logger = "0.11"
log.workspace = true
anyhow.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = { version = "0.4.0", default-features = false }
