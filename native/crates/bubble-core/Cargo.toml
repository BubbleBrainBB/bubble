[package]
name = "bubble-core"
description = "Bubble's agent core in Rust: configuration, providers and the agent loop."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["http2", "macos-system-configuration"] }
futures-util.workspace = true
log.workspace = true
dirs.workspace = true
ignore = "0.4"
regex = "1"
sha2 = "0.10"
rquickjs = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
