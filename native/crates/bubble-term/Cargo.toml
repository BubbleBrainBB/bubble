[package]
name = "bubble-term"
description = "A terminal platform for NSH apps: the engine's views drawn as character cells, keys and the mouse as its events."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nsh-core = "0.4.0"
nsh-engine = "0.4.0"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
unicode-width = "0.2"
log.workspace = true

[dev-dependencies]
nsh-base = "0.4.0"
