name: Native release

# Builds the Rust `bubble` for every npm platform and, only when started by
# hand with publish set, publishes the platform packages and then
# @bubblebrain-ai/bubble (which needs the NPM_TOKEN secret).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z or x.y.z-tag)"
        required: true
      publish:
        description: "Publish to npm (otherwise only build and keep the packages as artifacts)"
        type: boolean
        default: false
      tag:
        description: "npm dist-tag"
        default: latest

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - name: Build and package
        run: node native/npm/build.mjs --version "${{ inputs.version }}" --platforms-only
      - name: Test the binary
        shell: bash
        run: |
          exe=native/npm/dist/${{ matrix.platform }}/bin/bubble
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version | grep -F "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-${{ matrix.platform }}
          path: native/npm/dist/${{ matrix.platform }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: native/npm/dist
          pattern: bubble-*
      - name: Assemble the main package
        run: |
          cd native/npm/dist
          for d in bubble-*; do mv "$d" "${d#bubble-}"; done
          chmod +x */bin/bubble 2>/dev/null || true
          cd ../../..
          node -e '
            const fs = require("fs");
            const main = JSON.parse(fs.readFileSync("native/npm/bubble/package.json", "utf8"));
            main.version = process.argv[1];
            const platforms = ["darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64", "win32-x64"];
            main.optionalDependencies = Object.fromEntries(platforms.map((p) => ["@bubblebrain-ai/bubble-" + p, process.argv[1]]));
            fs.cpSync("native/npm/bubble", "native/npm/dist/bubble", { recursive: true });
            fs.writeFileSync("native/npm/dist/bubble/package.json", JSON.stringify(main, null, 2) + "\n");
          ' "${{ inputs.version }}"
      - name: Pack
        run: |
          mkdir -p tarballs
          for d in native/npm/dist/*/; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"); done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs
      - name: Publish
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish "native/npm/dist/$d" --access public --tag "${{ inputs.tag }}"
          done
          npm publish native/npm/dist/bubble --access public --tag "${{ inputs.tag }}"
